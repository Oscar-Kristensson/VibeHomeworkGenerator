<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathsheet</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/worksheet.css">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#worksheet" data-i18n="app.skip"></a>
  <header class="topbar">
    <h1 class="brand" data-i18n="app.name"></h1>
    <span id="save-status" class="save-status" role="status"></span>
    <div class="file-actions">
      <button type="button" id="btn-new" class="btn" data-i18n="file.new"></button>
      <button type="button" id="btn-open" class="btn" data-i18n="file.open"></button>
      <input type="file" id="file-input" accept=".json,.html,application/json,text/html" hidden>
      <button type="button" id="btn-save" class="btn primary" data-i18n="file.save"></button>
      <button type="button" id="btn-json" class="btn" aria-pressed="false" data-i18n="json.edit"></button>
      <button type="button" id="btn-export" class="btn" data-i18n="file.export"></button>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <main class="layout">
    <aside class="panel" data-i18n-label="tab.list">
      <div class="tabs" role="tablist" data-i18n-label="tab.list">
        <button type="button" role="tab" id="tab-btn-custom" class="tab" aria-selected="true" aria-controls="tab-custom" data-i18n="tab.custom"></button>
        <button type="button" role="tab" id="tab-btn-generate" class="tab" aria-selected="false" tabindex="-1" aria-controls="tab-generate" data-i18n="tab.generate"></button>
      </div>

      <section id="tab-custom" role="tabpanel" aria-labelledby="tab-btn-custom">
        <form id="problem-form" novalidate>
          <p id="editing-note" class="editing-note" hidden></p>

          <div class="field">
            <label for="f-statement" data-i18n="form.statement"></label>
            <div id="snippet-bar" class="snippet-bar" role="group" data-i18n-label="form.snippets"></div>
            <textarea id="f-statement" rows="4" spellcheck="true" aria-describedby="err-statement"></textarea>
            <p id="err-statement" class="field-error" role="alert" hidden></p>
          </div>

          <div class="field">
            <label for="f-answer" data-i18n="form.answer"></label>
            <textarea id="f-answer" rows="2"></textarea>
          </div>

          <div class="field">
            <label for="f-solution" data-i18n="form.solution"></label>
            <textarea id="f-solution" rows="3"></textarea>
          </div>

          <div class="field-row">
            <div class="field narrow">
              <label for="f-points" data-i18n="form.points"></label>
              <input id="f-points" type="number" min="0" step="0.5" value="1" inputmode="decimal">
            </div>
            <div class="field grow">
              <label for="f-tags" data-i18n="form.tags"></label>
              <input id="f-tags" type="text" autocomplete="off">
            </div>
          </div>

          <p class="hint" data-i18n="form.hint"></p>

          <div class="preview" aria-live="off">
            <h2 class="preview-title" data-i18n="form.preview"></h2>
            <div class="ws-page preview-card">
              <div class="preview-row"><div id="pv-statement" class="ws-statement preview-body"></div></div>
              <div class="preview-row ws-answer" hidden><strong data-i18n="problem.answer"></strong> <span id="pv-answer" class="preview-body"></span></div>
              <div class="preview-row ws-solution" hidden><strong data-i18n="problem.solution"></strong> <span id="pv-solution" class="preview-body"></span></div>
            </div>
            <ul id="math-errors" class="math-errors" hidden></ul>
          </div>

          <div class="form-actions">
            <button type="submit" id="btn-submit" class="btn primary"></button>
            <button type="button" id="btn-cancel" class="btn" data-i18n="form.cancel" hidden></button>
          </div>
        </form>
      </section>

      <section id="tab-generate" role="tabpanel" aria-labelledby="tab-btn-generate" hidden>
        <form id="generate-form" novalidate>
          <div class="field">
            <label for="g-generator" data-i18n="gen.generator"></label>
            <select id="g-generator"></select>
          </div>

          <fieldset class="params">
            <legend data-i18n="gen.settings"></legend>
            <div id="g-params" class="params-grid"></div>
          </fieldset>

          <div class="field-row">
            <div class="field narrow">
              <label for="g-count" data-i18n="gen.count"></label>
              <input id="g-count" type="number" min="1" max="50" step="1" value="5" inputmode="numeric">
            </div>
            <div class="field narrow">
              <label for="g-points" data-i18n="gen.points"></label>
              <input id="g-points" type="number" min="0" step="0.5" value="1" inputmode="decimal">
            </div>
          </div>
          <p id="g-error" class="field-error" role="alert" hidden></p>

          <div class="form-actions">
            <button type="submit" class="btn primary" data-i18n="gen.button"></button>
          </div>
        </form>
      </section>
    </aside>

    <section class="desk" id="worksheet" tabindex="-1" data-i18n-label="sheet.worksheet">
      <div class="sheet-controls">
        <label class="check"><input type="checkbox" id="opt-answers"> <span data-i18n="controls.showAnswers"></span></label>
        <label class="check"><input type="checkbox" id="opt-fields"> <span data-i18n="controls.nameDate"></span></label>
        <label class="select"><span data-i18n="controls.numbering"></span>
          <select id="opt-numbering">
            <option value="decimal" data-i18n="numbering.decimal"></option>
            <option value="alpha" data-i18n="numbering.alpha"></option>
            <option value="roman" data-i18n="numbering.roman"></option>
            <option value="none" data-i18n="numbering.none"></option>
          </select>
        </label>
        <span id="total-points" class="total-points"></span>
      </div>

      <article class="sheet ws-page">
        <header class="ws-header">
          <input id="ws-title" class="ws-title ws-input" type="text" autocomplete="off" data-i18n-placeholder="sheet.titlePlaceholder" data-i18n-label="sheet.titlePlaceholder">
          <input id="ws-subject" class="ws-subject ws-input" type="text" autocomplete="off" data-i18n-placeholder="sheet.subjectPlaceholder" data-i18n-label="sheet.subjectPlaceholder">
          <div id="ws-fields" class="ws-fields">
            <span class="ws-field" data-i18n="sheet.name"></span>
            <span class="ws-field" data-i18n="sheet.date"></span>
          </div>
        </header>

        <ol id="problem-list" class="ws-problems" data-numbering="decimal" data-i18n-label="sheet.problems"></ol>

        <div id="empty-state" class="empty">
          <h2 data-i18n="empty.title"></h2>
          <p data-i18n="empty.body"></p>
          <button type="button" id="btn-example" class="btn" data-i18n="empty.example"></button>
        </div>
      </article>
    </section>

    <section id="json-view" class="desk json-desk" aria-labelledby="json-title" hidden>
      <div class="json-wrap">
        <h2 id="json-title" data-i18n="json.title"></h2>
        <p class="hint" data-i18n="json.intro"></p>
        <textarea id="json-text" class="json-text" spellcheck="false" autocomplete="off" data-i18n-label="json.label"></textarea>
        <div id="json-status" class="json-status" role="status"></div>
        <div class="form-actions">
          <button type="button" id="json-apply" class="btn primary" data-i18n="json.apply"></button>
          <button type="button" id="json-revert" class="btn" data-i18n="json.revert"></button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="export-dialog" class="dialog" aria-labelledby="export-title">
    <form method="dialog" id="export-form" novalidate>
      <h2 id="export-title" data-i18n="export.title"></h2>
      <p class="hint" data-i18n="export.intro"></p>

      <fieldset class="opts">
        <legend data-i18n="export.key"></legend>
        <label class="check"><input type="checkbox" id="x-key"><span data-i18n="export.includeKey"></span></label>
        <label class="check indent"><input type="checkbox" id="x-solutions"><span data-i18n="export.includeSolutions"></span></label>
        <label class="check indent"><input type="checkbox" id="x-newpage"><span data-i18n="export.newPage"></span></label>
      </fieldset>

      <fieldset class="opts">
        <legend data-i18n="export.content"></legend>
        <label class="check"><input type="checkbox" id="x-points"><span data-i18n="export.showPoints"></span></label>
        <label class="check"><input type="checkbox" id="x-shuffle"><span data-i18n="export.shuffle"></span></label>
      </fieldset>

      <fieldset class="opts">
        <legend data-i18n="export.fonts"></legend>
        <label class="check"><input type="radio" name="x-fonts" id="x-fonts-cdn"><span><span data-i18n="export.fontsCdn"></span><small data-i18n="export.fontsCdnHint"></small></span></label>
        <label class="check"><input type="radio" name="x-fonts" id="x-fonts-embed"><span><span data-i18n="export.fontsEmbed"></span><small data-i18n="export.fontsEmbedHint"></small></span></label>
      </fieldset>

      <fieldset class="opts">
        <legend data-i18n="export.source"></legend>
        <label class="check"><input type="checkbox" id="x-source"><span><span data-i18n="export.embedSource"></span><small data-i18n="export.embedSourceHint"></small></span></label>
      </fieldset>

      <p id="export-status" class="hint" role="status"></p>
      <div class="form-actions">
        <button type="button" id="x-download" class="btn primary" data-i18n="export.download"></button>
        <button type="button" id="x-preview" class="btn" data-i18n="export.preview"></button>
        <button type="button" id="x-close" class="btn" data-i18n="export.close"></button>
      </div>
    </form>
  </dialog>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
</body>
</html>
